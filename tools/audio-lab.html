<!doctype html>
<meta charset="utf-8">
<title>音の試聴台 ── 確定申告からは逃げられない</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 28px 32px 60px; background: #0b0b0d; color: #ddd6c4;
         font: 14px/1.7 "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
  h1 { font-size: 1.15rem; letter-spacing: .1em; margin: 0 0 4px; color: #e8e0c8; }
  .lead { color: #8a8474; font-size: .8rem; margin-bottom: 22px; max-width: 62em; }
  .lead b { color: #b0a77c; }
  section { border: 1px solid #2a2a2e; border-radius: 6px; padding: 16px 18px; margin-bottom: 16px;
            background: #101013; }
  h2 { font-size: .85rem; letter-spacing: .12em; margin: 0 0 3px; color: #b0a77c; }
  .desc { font-size: .74rem; color: #7d786a; margin-bottom: 12px; }
  button { background: #17171b; border: 1px solid #45454e; color: #ddd6c4; padding: 7px 16px;
           border-radius: 4px; cursor: pointer; font: inherit; font-size: .8rem; margin-right: 8px; }
  button:hover { border-color: #b0a77c; color: #fff; }
  button.on { background: #2d2a1e; border-color: #b0a77c; color: #fff; }
  .row { display: flex; align-items: center; gap: 10px; margin: 7px 0; font-size: .76rem; color: #9a927c; }
  .row label { min-width: 8.5em; }
  .row input[type=range] { width: 210px; accent-color: #b0a77c; }
  .row output { min-width: 5em; font-variant-numeric: tabular-nums; color: #c9c1a5; }
  /* 【sticky にしないこと】以前 position:sticky にしていたが、MASTER が縦に大きい
     （波形キャンバス込みで200px超）ため、スクロールすると直下のセクションの見出しと
     スライダーを覆い隠してしまった。素直に通常フローに置く。 */
  #master { background: #131318; border-color: #45454e; }
  canvas { display: block; width: 100%; height: 90px; background: #08080a;
           border: 1px solid #26262b; border-radius: 4px; margin-top: 10px; }
  .hint { font-size: .72rem; color: #6e6a5e; margin-top: 10px; }
  code { color: #b0a77c; font-size: .95em; }
</style>

<h1>音の試聴台</h1>
<div class="lead">
  <code>src/audio.js</code> の音を1つずつ鳴らして確かめるための開発用ツール。ゲーム本体は起動しない。<br>
  すべて WebAudio のランタイム合成で、音声ファイルは1つも使っていない。<br>
  <b>スライダーで好みの値に合わせたら、その数値を伝えてください。</b>そのまま既定値に反映します。
</div>

<section id="master">
  <h2>MASTER</h2>
  <div class="desc">最初に「開始」を押すこと（ブラウザの自動再生ポリシーのため、ユーザー操作なしでは音が出ない）</div>
  <button id="btnStart">▶ 開始</button>
  <button id="btnStopAll">■ 全部止める</button>
  <div class="row">
    <label>全体音量</label>
    <input type="range" id="mVol" min="0" max="100" value="80">
    <output id="mVolV">80%</output>
  </div>
  <canvas id="scope"></canvas>
  <div class="hint">上：波形　下：スペクトル（左=低音 右=高音）</div>
</section>

<div id="panels"></div>

<script type="module">
import * as A from "../src/audio.js";

const $ = id => document.getElementById(id);
let started = false, analyser = null;

/* ---- 試聴パネルの定義 ---------------------------------------------------
 * loop:true  … start/stop するもの（環境音）
 * loop:false … 1回鳴らすもの（効果音）
 * params     … スライダーで調整したい値。key は audio.js の handle.set() の名前と一致させる
 * ---------------------------------------------------------------------- */
/* 【雨とドローンはv15で廃止した】実聴の結果、雨は窓の「晴れた夜空」テクスチャと矛盾し、
 * ドローンは合成音だと分かってしまったため。生成関数ごと audio.js から消してあるので、
 * ここにパネルを足しても動かない。復活させたいときは git log で v14 の audio.js を見ること。 */
const PANELS = [
  { id: "room", title: "部屋鳴り", loop: true, desc: "ほとんど聞こえない低域のノイズ。完全な無音は不自然で安っぽく聞こえるので、静けさに実体を与えるために敷く。単体ではほぼ何も聞こえないのが正常。",
    start: o => A.startRoomTone(o),
    params: [
      { key: "vol", label: "音量", min: 0, max: 30, val: 5, scale: 0.01, fmt: v => (v*100).toFixed(0) + "%" },
      { key: "cutHz", label: "カットオフ", min: 80, max: 900, val: 240, fmt: v => v + " Hz" },
    ] },
  { id: "fridge", title: "冷蔵庫のうなり", loop: true, desc: "基音＋倍音＋機械のざらつき。ゲーム本編では cycle:true で数十秒おきに運転/停止する（生活感が出る）。ここでは常時鳴らす。",
    start: o => A.startFridge(o),
    params: [
      { key: "vol", label: "音量", min: 0, max: 30, val: 6, scale: 0.01, fmt: v => (v*100).toFixed(0) + "%" },
      { key: "baseHz", label: "うなりの高さ", min: 50, max: 240, val: 118, fmt: v => v + " Hz" },
    ] },

  { id: "footstep", title: "足音", loop: false, seq: 6, desc: "<b>v18で既定値を実聴で確定した</b>（body120 / ペタ12% / 余韻25ms / 明るさ720Hz）。ペタは12%と非常に薄く、「ペタを足す」のではなく暗い胴体に<b>気配として混ぜる</b>使い方になっている。<br><b>ばらつきは「♪ 6歩続けて」で確かめること。</b>1回鳴らしただけでは分からない。ばらつきを0にすると固定値の音（＝上のスライダーそのまま）が聴ける。音量のばらつきが一番効く（人間の歩行でも1歩ごとの体重の乗り方が最も変わるため）。ゲーム本編は<b>ばらつき100%</b>で鳴らしており、さらに歩く間隔自体も±15%崩している。<br>中域層は v17 で狭いbandpass（＝乾いた「擦れ／コツ」）から highpass+lowpass 1段ずつの広い帯域（＝柔らかいものが面を叩く「ペタ」）に作り直した。ノイズはピンク（-3dB/oct）。ホワイトだと重心1355Hzで「紙が擦れる」音になり、かといってローパスを急峻にすると帯域が狭まって音高が立つ。ピンクなら幅を保ったまま暗くできる。<br><b>胴体の帯域を下げると芯（音高感）が戻る</b>のは実測で確認済み：自己相関ピークが 320Hz→0.40、200Hz→0.48、150Hz→0.53、<b>120Hz→0.60</b>（純正弦波=1.00、v15のバスドラ足音=0.98）。120Hzは実聴で選ばれた値なので採用しているが、「またバスドラっぽい」と感じたらここを上げるのが最初の一手。オシレーターは1つも使っていない。",
    fire: o => A.footstep(o.vol, { pan: o.pan, body: o.body, peta: o.peta, tone: o.tone, snap: o.snap, vary: o.vary }),
    params: [
      { key: "vol", label: "音量", min: 0, max: 100, val: 35, scale: 0.01, fmt: v => (v*100).toFixed(0) + "%" },
      { key: "vary", label: "ばらつき", min: 0, max: 100, val: 100, scale: 0.01, fmt: v => v === 0 ? "無し（固定）" : (v*100).toFixed(0) + "%（本編は100%）" },
      { key: "peta", label: "ペタの量", min: 0, max: 120, val: 12, scale: 0.01, fmt: v => v === 0 ? "無し（胴体のみ）" : (v*100).toFixed(0) + "%" },
      { key: "snap", label: "ペタの余韻", min: 15, max: 150, val: 25, fmt: v => v + " ms" + (v <= 45 ? "（ペタペタ寄り）" : v >= 110 ? "（ドスッ寄り）" : "") },
      { key: "tone", label: "ペタの明るさ", min: 400, max: 3000, val: 720, fmt: v => v + " Hz" + (v >= 1500 ? "（紙が擦れる音に寄る）" : "") },
      { key: "body", label: "胴体の帯域", min: 90, max: 800, val: 120, fmt: v => v + " Hz" + (v < 170 ? "（芯が上がる域）" : "") },
      { key: "pan", label: "左右", min: -100, max: 100, val: 0, scale: 0.01, fmt: v => v === 0 ? "中央" : (v < 0 ? "左 " : "右 ") + Math.abs(v*100).toFixed(0) + "%" },
    ] },
  { id: "heartbeat", title: "心音", loop: false, desc: "lub-dub の2拍。1拍目を強く、2拍目をやや弱く短く。<b>v16でゲームに配線した</b>：怪人が6.5m以内に入ると鳴りはじめ、密着すると間隔1.15秒→0.42秒、音量0.12→0.45まで上がる。隠れている間もあえて鳴らす。速さで近さを伝えているのは、音量だけだと音量つまみの大小と区別できないため。<br>これは足音と違い正弦波の下降スイープで作っている（＝バスドラと同じ作り）。心音は lub-dub のリズムで identify されるので成立しているが、足音と同時に鳴ったときに competing に聞こえるなら教えてください。",
    fire: o => A.heartbeat(o.vol, {}),
    params: [ { key: "vol", label: "音量", min: 0, max: 100, val: 50, scale: 0.01, fmt: v => (v*100).toFixed(0) + "%" } ] },
  { id: "tick", title: "時計の秒針", loop: false, desc: "短いノイズを狭い帯域で切り出す。tick と tock を交互に鳴らして「カチ・コチ」にする。<b>v16でゲームに配線した</b>：壁掛け時計の実際の位置（x=1.4, z=-5.9）から鳴るので左右に定位し、距離で減衰する（真下で0.13、部屋の反対側で無音）。刻みは<b>実時間で1秒</b>。ゲーム内時間は約30倍速なのでそれに同期させると時計に聞こえない。前触れで時計が壊れている間は0.45〜1.6秒のばらつきに崩れる。",
    fire: o => { A.clockTick(false, o.vol); setTimeout(() => A.clockTick(true, o.vol), 600); },
    params: [ { key: "vol", label: "音量", min: 0, max: 60, val: 12, scale: 0.01, fmt: v => (v*100).toFixed(0) + "%" } ] },
  { id: "thump", title: "衝撃音（thump）", loop: false, desc: "前触れ演出と e-Tax 却下時に鳴る低い衝撃音。",
    fire: o => A.thump(o.vol),
    params: [ { key: "vol", label: "音量", min: 0, max: 100, val: 50, scale: 0.01, fmt: v => (v*100).toFixed(0) + "%" } ] },
];

/* ---- パネル生成 ---- */
const panels = $("panels");
const state = {};   // id -> { handle, vals }

for (const p of PANELS) {
  state[p.id] = { handle: null, vals: {} };
  const sec = document.createElement("section");
  let btn = `<button data-act="${p.loop ? "toggle" : "fire"}" data-id="${p.id}">${p.loop ? "▶ 鳴らす" : "♪ 1回鳴らす"}</button>`;
  /* seq を持つパネルには「続けて鳴らす」を足す。**ばらつきは1回では判断できない**ので、
   * 足音のようにばらつきを持つ音には連続再生が必須。間隔もゲーム本編と同じように崩す。 */
  if (p.seq) btn += `<button data-act="seq" data-id="${p.id}">♪ ${p.seq}歩続けて</button>`;
  sec.innerHTML = `<h2>${p.title}</h2><div class="desc">${p.desc}</div>${btn}`;
  for (const q of p.params) {
    state[p.id].vals[q.key] = q.val * (q.scale || 1);
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<label>${q.label}</label>
      <input type="range" min="${q.min}" max="${q.max}" value="${q.val}" data-id="${p.id}" data-key="${q.key}" data-scale="${q.scale || 1}">
      <output>${q.fmt(q.val * (q.scale || 1))}</output>`;
    const inp = row.querySelector("input"), out = row.querySelector("output");
    inp.addEventListener("input", () => {
      const v = Number(inp.value) * (q.scale || 1);
      state[p.id].vals[q.key] = v;
      out.textContent = q.fmt(v);
      const h = state[p.id].handle;
      if (h && h.set) h.set(q.key, v);      // ループ中はリアルタイムに反映
    });
    sec.appendChild(row);
  }
  panels.appendChild(sec);
}

/* ---- 操作 ---- */
function ensureStarted() {
  if (started) return true;
  A.audioInit({ vol: Number($("mVol").value) / 100, muted: false });
  analyser = A.AC.createAnalyser();
  analyser.fftSize = 2048;
  A.masterGain.connect(analyser);
  started = true;
  $("btnStart").textContent = "● 動作中";
  $("btnStart").classList.add("on");
  draw();
  return true;
}

$("btnStart").addEventListener("click", ensureStarted);
$("btnStopAll").addEventListener("click", () => {
  A.stopAll();
  for (const id in state) state[id].handle = null;
  document.querySelectorAll('button[data-act="toggle"]').forEach(b => {
    b.classList.remove("on"); b.textContent = "▶ 鳴らす";
  });
});
$("mVol").addEventListener("input", e => {
  $("mVolV").textContent = e.target.value + "%";
  if (started) A.setVolume(Number(e.target.value) / 100);
});

panels.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  ensureStarted();
  const id = b.dataset.id, p = PANELS.find(x => x.id === id), st = state[id];
  if (b.dataset.act === "fire") { p.fire(st.vals); return; }
  if (b.dataset.act === "seq") {
    // 間隔もゲーム本編と同じ ±15% で崩す（等間隔だとそれ自体が機械的に聞こえる）
    let d = 0;
    for (let i = 0; i < p.seq; i++) {
      setTimeout(() => p.fire(st.vals), d);
      d += 480 + Math.random() * 150;
    }
    return;
  }
  if (st.handle) {
    st.handle.stop(0.25); st.handle = null;
    b.classList.remove("on"); b.textContent = "▶ 鳴らす";
  } else {
    st.handle = p.start({ ...st.vals });
    b.classList.add("on"); b.textContent = "■ 止める";
  }
});

/* ---- 波形＋スペクトル表示 ---- */
const cv = $("scope"), cx = cv.getContext("2d");
function draw() {
  requestAnimationFrame(draw);
  if (!analyser) return;
  const w = cv.width = cv.clientWidth, h = cv.height = cv.clientHeight;
  cx.clearRect(0, 0, w, h);
  // 波形（上半分）
  const td = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(td);
  cx.strokeStyle = "#b0a77c"; cx.lineWidth = 1; cx.beginPath();
  for (let i = 0; i < w; i++) {
    const v = td[Math.floor(i / w * td.length)];
    const y = h * 0.25 - v * h * 0.22;
    i ? cx.lineTo(i, y) : cx.moveTo(i, y);
  }
  cx.stroke();
  // スペクトル（下半分）
  const fd = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(fd);
  cx.fillStyle = "#4a6a8a";
  const n = Math.floor(fd.length * 0.55);          // 高域は使わないので切る
  for (let i = 0; i < w; i++) {
    const v = fd[Math.floor(i / w * n)] / 255;
    cx.fillRect(i, h - v * h * 0.46, 1, v * h * 0.46);
  }
  cx.strokeStyle = "#26262b"; cx.beginPath(); cx.moveTo(0, h * 0.5); cx.lineTo(w, h * 0.5); cx.stroke();
}
</script>
